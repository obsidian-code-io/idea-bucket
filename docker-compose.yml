services:
  idea-bucket:
    build: .
    restart: unless-stopped
    environment:
      - PORT=3000
      - DATA_DIR=/data
      - DB_PATH=/data/idea-bucket.db
      - UPLOAD_DIR=/data/uploads
      - MAX_UPLOAD_MB=25
      - ENABLE_BASIC_AUTH=true
      - APP_BASIC_AUTH_USER=${APP_BASIC_AUTH_USER}
      - APP_BASIC_AUTH_PASS=${APP_BASIC_AUTH_PASS}
      - COOKIE_SECRET=${COOKIE_SECRET}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL}
    volumes:
      - idea-bucket-data:/data
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  idea-bucket-data:
